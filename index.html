<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork DOM 3 - Card Articoli</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">

        <h1 class="mb-4">Articoli</h1>

        <!-- Bottoni -->
        <div class="mb-4">
            <button id="btnGenera" class="btn btn-primary me-2">Genera Card</button>
            <button id="btnReset" class="btn btn-secondary">Reset</button>
        </div>

        <!-- Alert (nascosto all'inizio) -->
        <div id="alertFiniti" class="alert alert-warning d-none" role="alert">
            Articoli Finiti
        </div>

        <!-- Contenitore delle card -->
        <div id="contenitoreCard" class="row g-4">
            <!-- Le card verranno inserite qui -->
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/main.js"></script>
</body>
</html>
